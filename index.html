<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Herói</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <img src="imagens/logo.png">
        <h1> Vamos descobrir a sua classificação?</h1>
    </header>
    <main>
        <section>
            <form method="post" id="formHeroi">
                <div>
                    <label for="name"> Nickname</label>
                    <input id="name" name="nickname" required type="text">
                </div>
                <div>
                    <label for="xp"> Qual seu XP?</label>
                    <input id="xp" name="xp" type="number" min="0" max="100000" required>
                </div>
                <input id="classificacaoHeroi" name="classe" type="hidden">



                <button type="submit"> Enviar </button>
            </form>
            <div id="resultado">
                Classificação:
            </div>
        </section>
    </main>
    <footer>Projeto de estudos <a href="https://github.com/GilsonFarma/desafio-heroi-nivel">GitHub</a></footer>
    <script src="calssificacaoHeroi.js"></script>
</body>

</html>
